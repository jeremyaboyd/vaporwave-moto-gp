<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NEON NIGHTRIDER — Infinite Moto-GP Street Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff2fd6;
    --cyan: #2fe9ff;
    --purple: #9b30ff;
    --dim: #7a6f9b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05010d; touch-action: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .hud {
    position: fixed; inset: 0; pointer-events: none;
    font-family: 'Share Tech Mono', monospace;
    color: var(--cyan);
    text-shadow: 0 0 6px rgba(47,233,255,.8), 0 0 18px rgba(47,233,255,.4);
    user-select: none; -webkit-user-select: none;
  }
  .hud .label {
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: clamp(9px, 1.2vw, 12px); letter-spacing: .25em; color: var(--dim);
    text-shadow: none;
  }
  #hud-score { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 20px; }
  #hud-score .value {
    font-family: 'Orbitron', sans-serif; font-weight: 900;
    font-size: clamp(22px, 3.4vw, 40px); color: var(--pink);
    text-shadow: 0 0 8px rgba(255,47,214,.9), 0 0 24px rgba(255,47,214,.45);
  }
  #hud-score .hi { margin-top: 2px; font-size: clamp(11px, 1.4vw, 15px); }
  #hud-speed { position: absolute; top: max(16px, env(safe-area-inset-top)); right: 20px; text-align: right; }
  #hud-speed .value {
    font-family: 'Orbitron', sans-serif; font-weight: 900;
    font-size: clamp(22px, 3.4vw, 40px); color: var(--pink);
    text-shadow: 0 0 8px rgba(255,47,214,.9), 0 0 24px rgba(255,47,214,.45);
  }
  #hud-speed .unit { font-size: clamp(11px, 1.4vw, 15px); color: var(--cyan); }
  #hud-stats {
    position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); right: 20px;
    text-align: right; font-size: clamp(11px, 1.5vw, 16px); line-height: 1.6;
  }
  #hud-biome {
    position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 20px;
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: clamp(10px, 1.4vw, 14px); letter-spacing: .35em; color: var(--purple);
    text-shadow: 0 0 10px rgba(155,48,255,.8);
  }

  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at 50% 60%, rgba(20,2,40,.55), rgba(5,1,13,.88));
    font-family: 'Orbitron', sans-serif; text-align: center;
    transition: opacity .4s; z-index: 10;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 {
    font-weight: 900; font-size: clamp(34px, 7vw, 84px); line-height: .95;
    background: linear-gradient(180deg, var(--pink) 30%, var(--purple) 70%, var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(255,47,214,.55));
    letter-spacing: .04em; font-style: italic;
  }
  #overlay .sub {
    font-family: 'Share Tech Mono', monospace; color: var(--cyan);
    font-size: clamp(12px, 1.8vw, 17px); letter-spacing: .2em;
    text-shadow: 0 0 8px rgba(47,233,255,.7);
  }
  #overlay .big-score {
    font-weight: 900; font-size: clamp(28px, 5vw, 56px); color: var(--pink);
    text-shadow: 0 0 12px rgba(255,47,214,.8), 0 0 40px rgba(255,47,214,.4);
  }
  #overlay .prompt {
    font-family: 'Share Tech Mono', monospace; color: #fff;
    font-size: clamp(13px, 2vw, 19px); letter-spacing: .25em;
    animation: blink 1.1s steps(2) infinite;
    text-shadow: 0 0 10px rgba(255,255,255,.7);
  }
  #overlay .controls {
    font-family: 'Share Tech Mono', monospace; color: var(--dim);
    font-size: clamp(10px, 1.4vw, 13px); letter-spacing: .12em; line-height: 1.9;
  }
  #overlay .controls b { color: var(--cyan); text-shadow: 0 0 6px rgba(47,233,255,.6); }
  @keyframes blink { 50% { opacity: .15; } }

  #touch-controls { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  body.touch #touch-controls { display: block; }
  .tbtn {
    position: absolute; pointer-events: auto;
    width: clamp(58px, 11vw, 84px); height: clamp(58px, 11vw, 84px);
    border-radius: 50%; border: 2px solid rgba(47,233,255,.65);
    background: rgba(47,233,255,.08); color: var(--cyan);
    font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    text-shadow: 0 0 8px rgba(47,233,255,.8);
    box-shadow: 0 0 14px rgba(47,233,255,.25), inset 0 0 14px rgba(47,233,255,.12);
  }
  .tbtn:active, .tbtn.held { background: rgba(255,47,214,.18); border-color: rgba(255,47,214,.8); color: var(--pink); }
  #t-left  { left: 18px;  bottom: calc(max(18px, env(safe-area-inset-bottom)) + 40px); }
  #t-right { left: calc(18px + clamp(58px,11vw,84px) + 14px); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 40px); }
  #t-gas   { right: 18px; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 40px + clamp(58px,11vw,84px) + 12px); }
  #t-brake { right: 18px; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 40px); }
</style>
</head>
<body>
<div id="app"></div>

<div class="hud">
  <div id="hud-score">
    <div class="label">SCORE</div>
    <div class="value" id="score">0</div>
    <div class="label" style="margin-top:6px">HIGH SCORE</div>
    <div class="hi" id="high-score">0</div>
  </div>
  <div id="hud-speed">
    <div class="label">SPEED</div>
    <div class="value" id="speed">0</div>
    <div class="unit">KM/H</div>
  </div>
  <div id="hud-stats">
    <div><span class="label">DISTANCE&nbsp;</span><span id="distance">0.00 KM</span></div>
    <div><span class="label">TIME ALIVE&nbsp;</span><span id="time-alive">00:00.00</span></div>
  </div>
  <div id="hud-biome"><span id="biome-name">NEON CITY</span></div>
</div>

<div id="touch-controls">
  <div class="tbtn" id="t-left">&#9664;</div>
  <div class="tbtn" id="t-right">&#9654;</div>
  <div class="tbtn" id="t-gas">GAS</div>
  <div class="tbtn" id="t-brake">BRK</div>
</div>

<div id="overlay">
  <h1>NEON<br>NIGHTRIDER</h1>
  <div class="sub" id="overlay-sub">INFINITE MOTO-GP STREET RUNNER</div>
  <div class="big-score" id="overlay-score" style="display:none"></div>
  <div class="prompt" id="overlay-prompt">PRESS ENTER / TAP TO RIDE</div>
  <div class="controls">
    <b>W</b> ACCELERATE &nbsp; <b>S</b> BRAKE &nbsp; <b>A</b>/<b>D</b> LEAN &nbsp; <b>MOUSE</b> LOOK &nbsp; <b>R</b> RESTART
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
